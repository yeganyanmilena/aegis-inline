name: Linux verification
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          chmod +x scripts/make-certs.sh tests/*.sh
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev openssl iproute2 ethtool tcpdump python3
      - name: Compile and test packet processing and key exchange
        run: make test
      - name: Exercise the four-node inline path
        run: sudo make integration
